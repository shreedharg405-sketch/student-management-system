<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Sign In</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background-color: #161f30;
            border: 1px solid #243249;
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        /* Top Accent Bar */
        .top-accent-bar {
            height: 4px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #38bdf8);
        }

        .card-body {
            padding: 36px 32px;
        }

        /* Brand Header */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon-box {
            width: 56px;
            height: 56px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #818cf8;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 21px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.4px;
            margin: 0;
        }

        .brand-subtitle {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Role Switcher Tabs */
        .role-section {
            margin-bottom: 22px;
        }

        .role-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .role-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .role-hint {
            font-size: 11px;
            color: #818cf8;
            font-weight: 600;
        }

        .role-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #0d1424;
            padding: 5px;
            border-radius: 10px;
            border: 1px solid #1e293b;
        }

        .role-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px 4px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .role-btn i {
            font-size: 14px;
        }

        .role-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }

        .role-btn.active {
            background: #6366f1;
            color: #ffffff;
            font-weight: 700;
            border-color: #6366f1;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        /* Error Alert Banner */
        .alert-error {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            align-items: center;
            gap: 10px;
        }

        .alert-error i {
            color: #ef4444;
            font-size: 15px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 14px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 46px;
            background: #0d1424;
            border: 1.5px solid #243249;
            border-radius: 8px;
            padding: 0 40px 0 38px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input::placeholder {
            color: #475569;
        }

        .form-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: #0d1424;
        }

        .btn-toggle-eye {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 15px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-toggle-eye:hover {
            color: #cbd5e1;
        }

        /* Sign In Button */
        .btn-submit {
            width: 100%;
            height: 48px;
            background: #6366f1;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
            transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        }

        .btn-submit:hover {
            background: #4f46e5;
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* Demo Credentials Quick-Fill Box */
        .demo-box {
            margin-top: 24px;
            background: #0d1424;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 14px;
        }

        .demo-box-header {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .demo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #161f30;
        }

        .demo-item:last-child {
            border-bottom: none;
        }

        .demo-item-role {
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .demo-fill-btn {
            background: #161f30;
            border: 1px solid #243249;
            color: #cbd5e1;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .demo-fill-btn:hover {
            border-color: #6366f1;
            color: #818cf8;
            background: rgba(99, 102, 241, 0.1);
        }

        /* Status Footer */
        .system-status {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        /* Simple Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: #1e293b;
            color: #f8fafc;
            border-left: 4px solid #10b981;
            padding: 12px 18px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Top Gradient Accent -->
            <div class="top-accent-bar"></div>

            <div class="card-body">
                <!-- Branding Header -->
                <div class="brand-header">
                    <div class="brand-icon-box">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h1 class="brand-title">Student Management System</h1>
                    <p class="brand-subtitle">Portal Sign In</p>
                </div>

                <!-- Error Alert Banner -->
                <div class="alert-error" id="error-banner">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="error-message" style="flex: 1;">Invalid credentials</span>
                    <button type="button" onclick="hideError()" style="background:none; border:none; color:#fca5a5; cursor:pointer; font-size:16px;">&times;</button>
                </div>

                <!-- Role Switcher -->
                <div class="role-section">
                    <div class="role-section-header">
                        <span class="role-label">Choose Role</span>
                        <span class="role-hint">Click to switch</span>
                    </div>
                    <div class="role-tabs">
                        <button type="button" class="role-btn active" id="btn-role-student" onclick="setRole('STUDENT')">
                            <i class="fa-solid fa-user-graduate"></i>
                            <span>Student</span>
                        </button>
                        <button type="button" class="role-btn" id="btn-role-staff" onclick="setRole('STAFF')">
                            <i class="fa-solid fa-chalkboard-user"></i>
                            <span>Faculty</span>
                        </button>
                        <button type="button" class="role-btn" id="btn-role-hod" onclick="setRole('HOD')">
                            <i class="fa-solid fa-user-tie"></i>
                            <span>HOD</span>
                        </button>
                    </div>
                </div>

                <!-- Login Form -->
                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="email" class="form-label">Email or ID</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input 
                                type="text" 
                                id="email" 
                                class="form-input" 
                                placeholder="name@institution.edu" 
                                value="student1@gmail.com"
                                required 
                                autocomplete="username"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="Enter password" 
                                value="student123"
                                required 
                                autocomplete="current-password"
                            >
                            <button type="button" class="btn-toggle-eye" id="toggle-password" title="Show / Hide Password" aria-label="Show / Hide Password">
                                <i class="fa-solid fa-eye" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-submit">
                        <i class="fa-solid fa-right-to-bracket" id="submit-icon"></i>
                        <span id="submit-text">Sign In</span>
                    </button>
                </form>

                <!-- Demo Credentials Box -->
                <div class="demo-box">
                    <div class="demo-box-header">
                        <span><i class="fa-solid fa-key" style="color: #818cf8; margin-right: 6px;"></i>Quick Fill Accounts</span>
                        <span style="color: #818cf8;">Click to Fill</span>
                    </div>
                    <div class="demo-item">
                        <div class="demo-item-role">
                            <i class="fa-solid fa-user-graduate" style="color: #6366f1;"></i>
                            <span>Student</span>
                        </div>
                        <button type="button" class="demo-fill-btn" onclick="setRole('STUDENT')">student1@gmail.com</button>
                    </div>
                    <div class="demo-item">
                        <div class="demo-item-role">
                            <i class="fa-solid fa-chalkboard-user" style="color: #10b981;"></i>
                            <span>Faculty</span>
                        </div>
                        <button type="button" class="demo-fill-btn" onclick="setRole('STAFF')">staff1@gmail.com</button>
                    </div>
                    <div class="demo-item">
                        <div class="demo-item-role">
                            <i class="fa-solid fa-user-tie" style="color: #f59e0b;"></i>
                            <span>HOD</span>
                        </div>
                        <button type="button" class="demo-fill-btn" onclick="setRole('HOD')">hod1@gmail.com</button>
                    </div>
                </div>

                <!-- Footer Status -->
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span>System Connected &bull; Localhost</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Login Logic -->
    <script>
        // Preset Credentials
        const CREDENTIALS = {
            STUDENT: {
                email: 'student1@gmail.com',
                password: 'student123',
                btnId: 'btn-role-student'
            },
            STAFF: {
                email: 'staff1@gmail.com',
                password: 'staff123',
                btnId: 'btn-role-staff'
            },
            HOD: {
                email: 'hod1@gmail.com',
                password: 'hod123',
                btnId: 'btn-role-hod'
            }
        };

        function setRole(role) {
            const data = CREDENTIALS[role];
            if (!data) return;

            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(data.btnId);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('email').value = data.email;
            document.getElementById('password').value = data.password;
            hideError();
        }

        // Toggle Password Visibility
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // Error Handling
        const errorBanner = document.getElementById('error-banner');
        const errorMessage = document.getElementById('error-message');

        function showError(msg) {
            errorMessage.textContent = msg;
            errorBanner.style.display = 'flex';
        }

        function hideError() {
            errorBanner.style.display = 'none';
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid fa-circle-check" style="color: #10b981;"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Form Submission
        const loginForm = document.getElementById('login-form');
        const btnSubmit = document.getElementById('btn-submit');
        const submitIcon = document.getElementById('submit-icon');
        const submitText = document.getElementById('submit-text');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError("Please enter both email and password.");
                return;
            }

            btnSubmit.disabled = true;
            submitIcon.className = "fa-solid fa-circle-notch fa-spin";
            submitText.textContent = "Signing In...";

            try {
                // Determine API endpoint URL
                const origin = window.location.origin;
                const path = window.location.pathname;
                let apiUrl = '/studentms/backend/auth/login.php';
                if (!path.includes('/studentms/')) {
                    apiUrl = '/backend/auth/login.php';
                }

                const response = await fetch(origin + apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok && data.success && data.user) {
                    localStorage.setItem('sms_user', JSON.stringify(data.user));
                    showToast(`Welcome back, ${data.user.name}!`);

                    setTimeout(() => {
                        const role = data.user.role;
                        if (role === 'STUDENT') {
                            window.location.href = 'student/dashboard.html';
                        } else if (role === 'ASSISTANT_PROFESSOR' || role === 'HOD') {
                            window.location.href = 'staff.html';
                        } else {
                            window.location.href = 'student/dashboard.html';
                        }
                    }, 400);
                } else {
                    showError(data.message || "Invalid email or password.");
                    btnSubmit.disabled = false;
                    submitIcon.className = "fa-solid fa-right-to-bracket";
                    submitText.textContent = "Sign In";
                }
            } catch (err) {
                showError(err.message || "Connection failed. Please check backend server.");
                btnSubmit.disabled = false;
                submitIcon.className = "fa-solid fa-right-to-bracket";
                submitText.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
