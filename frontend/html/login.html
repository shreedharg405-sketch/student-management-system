<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Sign In</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS Modules -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body style="background: radial-gradient(circle at top right, #1e293b, #0f172a); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

    <!-- Network Loader overlay -->
    <div class="network-status-pill hidden" id="network-status-pill">
        <div class="network-spinner"></div>
        <span id="network-status-text">Loading...</span>
    </div>

    <!-- Main Authentication Layout -->
    <div style="width: 100%; max-width: 440px; background-color: var(--bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-xl); overflow: hidden; position: relative;">
        <!-- Gold Decorative Accent top border -->
        <div style="height: 4px; background: linear-gradient(90deg, var(--accent-color), #f1c40f);"></div>
        
        <div style="padding: 40px 30px;">
            <!-- Brand Info Header -->
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 50px; height: 50px; background-color: var(--accent-light); color: var(--accent-color); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 16px; border: 1px solid rgba(212, 160, 23, 0.2);">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 style="font-size: 20px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">Student Management System</h1>
                <p style="font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px;" id="portal-sub-title">College Portal Login</p>
            </div>

            <!-- Tab Switchers -->
            <div style="display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; gap: 20px; justify-content: center;">
                <button id="tab-login" style="background: none; border: none; font-size: 14px; font-weight: 700; padding: 10px 16px; cursor: pointer; color: var(--accent-color); border-bottom: 2px solid var(--accent-color); transition: all var(--transition-fast);">Log In</button>
                <button id="tab-signup" style="background: none; border: none; font-size: 14px; font-weight: 600; padding: 10px 16px; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: all var(--transition-fast);">Sign Up</button>
            </div>

            <!-- Log In Form -->
            <form id="login-form" novalidate style="display: flex; flex-direction: column; gap: 20px;">
                <div class="floating-group" id="login-email-group">
                    <input type="text" id="login-email" placeholder="Email or Staff ID / Roll No" required>
                    <label for="login-email">Email or Staff ID / Roll No</label>
                    <span class="error-msg" id="login-email-error"></span>
                </div>
                
                <div class="floating-group" id="login-password-group">
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Password" required style="padding-right: 48px;">
                        <label for="login-password">Password</label>
                        <span class="toggle-password-btn" id="toggle-login-pass">
                            <i class="fa-solid fa-eye eye-icon"></i>
                        </span>
                    </div>
                    <span class="error-msg" id="login-password-error"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-submit-login" style="padding: 12px; margin-top: 10px;">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Sign In
                </button>
                
                <p style="text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 10px;">
                    Need a portal account? <span id="link-to-signup" style="color: var(--accent-color); font-weight: 600; cursor: pointer; text-decoration: underline;">Sign up now</span>
                </p>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="signup-form" novalidate style="display: none; flex-direction: column; gap: 16px;">
                <div class="floating-group" id="signup-name-group">
                    <input type="text" id="signup-name" placeholder="Full Name" required>
                    <label for="signup-name">Full Name</label>
                    <span class="error-msg" id="signup-name-error"></span>
                </div>

                <div class="floating-group" id="signup-email-group">
                    <input type="email" id="signup-email" placeholder="Email Address" required>
                    <label for="signup-email">Email Address</label>
                    <span class="error-msg" id="signup-email-error"></span>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; display: block;">Role</label>
                        <select id="signup-role" class="form-control" style="width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary);">
                            <option value="student">Student</option>
                            <option value="staff">Staff / Faculty</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; display: block;">Department</label>
                        <select id="signup-dept" class="form-control" style="width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary);">
                            <option value="ECE">ECE</option>
                            <option value="CSE">CSE</option>
                            <option value="IT">IT</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                            <option value="EEE">EEE</option>
                        </select>
                    </div>
                </div>

                <div class="floating-group" id="signup-password-group">
                    <div class="password-wrapper">
                        <input type="password" id="signup-password" placeholder="Password" required style="padding-right: 48px;">
                        <label for="signup-password">Password</label>
                        <span class="toggle-password-btn" id="toggle-signup-pass">
                            <i class="fa-solid fa-eye eye-icon"></i>
                        </span>
                    </div>
                    <span class="error-msg" id="signup-password-error"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-submit-signup" style="padding: 12px; margin-top: 8px;">
                    <i class="fa-solid fa-user-plus"></i>
                    Create Account
                </button>

                <p style="text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 8px;">
                    Already registered? <span id="link-to-login" style="color: var(--accent-color); font-weight: 600; cursor: pointer; text-decoration: underline;">Sign in</span>
                </p>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Script modules import -->
    <script src="../js/config.js"></script>
    <script>
        // Global utilities
        window.showLoading = function(text = "Loading...") {
            const pill = document.getElementById('network-status-pill');
            const txt = document.getElementById('network-status-text');
            if (pill && txt) {
                txt.textContent = text;
                pill.classList.remove('hidden');
            }
        };

        window.hideLoading = function() {
            const pill = document.getElementById('network-status-pill');
            if (pill) pill.classList.add('hidden');
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let iconClass = 'fa-circle-check';
            if (type === 'error') iconClass = 'fa-circle-xmark';
            if (type === 'warning') iconClass = 'fa-triangle-exclamation';
            if (type === 'info') iconClass = 'fa-circle-info';
            toast.innerHTML = `
                <i class="fa-solid ${iconClass}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        // Tab Switching
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const subTitle = document.getElementById('portal-sub-title');
        const linkToSignup = document.getElementById('link-to-signup');
        const linkToLogin = document.getElementById('link-to-login');

        function switchTab(tab) {
            if (tab === 'signup') {
                loginForm.style.display = 'none';
                signupForm.style.display = 'flex';
                tabLogin.style.color = 'var(--text-secondary)';
                tabLogin.style.borderBottomColor = 'transparent';
                tabSignup.style.color = 'var(--accent-color)';
                tabSignup.style.borderBottomColor = 'var(--accent-color)';
                subTitle.textContent = 'Create Portal Account';
            } else {
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
                tabSignup.style.color = 'var(--text-secondary)';
                tabSignup.style.borderBottomColor = 'transparent';
                tabLogin.style.color = 'var(--accent-color)';
                tabLogin.style.borderBottomColor = 'var(--accent-color)';
                subTitle.textContent = 'College Portal Login';
            }
        }

        tabLogin.addEventListener('click', () => switchTab('login'));
        tabSignup.addEventListener('click', () => switchTab('signup'));
        if (linkToSignup) linkToSignup.addEventListener('click', () => switchTab('signup'));
        if (linkToLogin) linkToLogin.addEventListener('click', () => switchTab('login'));

        if (window.location.hash === '#signup') {
            switchTab('signup');
        }

        // Password Reveal
        const toggleLoginPass = document.getElementById('toggle-login-pass');
        const loginPass = document.getElementById('login-password');
        if (toggleLoginPass && loginPass) {
            toggleLoginPass.addEventListener('click', () => {
                const type = loginPass.getAttribute('type') === 'password' ? 'text' : 'password';
                loginPass.setAttribute('type', type);
                toggleLoginPass.querySelector('i').className = type === 'password' ? 'fa-solid fa-eye eye-icon' : 'fa-solid fa-eye-slash eye-icon';
            });
        }

        const toggleSignupPass = document.getElementById('toggle-signup-pass');
        const signupPass = document.getElementById('signup-password');
        if (toggleSignupPass && signupPass) {
            toggleSignupPass.addEventListener('click', () => {
                const type = signupPass.getAttribute('type') === 'password' ? 'text' : 'password';
                signupPass.setAttribute('type', type);
                toggleSignupPass.querySelector('i').className = type === 'password' ? 'fa-solid fa-eye eye-icon' : 'fa-solid fa-eye-slash eye-icon';
            });
        }

        // Login Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailOrId = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!emailOrId || !password) {
                showToast("Please enter your email and password.", "warning");
                return;
            }

            try {
                const res = await apiFetch('/login', {
                    method: 'POST',
                    body: JSON.stringify({ email: emailOrId, password: password })
                });

                if (res.status === 'success' && res.data && res.data.user) {
                    const user = res.data.user;
                    localStorage.setItem('sms_user', JSON.stringify(user));
                    localStorage.setItem('sms_v2_user', JSON.stringify(user));
                    showToast(`Welcome back, ${user.name}!`);

                    setTimeout(() => {
                        if (user.role === 'staff' || user.role === 'faculty' || user.role === 'admin') {
                            window.location.href = '../staff.html';
                        } else {
                            window.location.href = '../student.html';
                        }
                    }, 800);
                } else {
                    showToast("Invalid email or password.", "error");
                }
            } catch (err) {
                showToast(err.message || "Invalid email or password.", "error");
            }
        });

        // Signup Submit
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const role = document.getElementById('signup-role').value;
            const department = document.getElementById('signup-dept').value;

            if (!name || !email || !password) {
                showToast("Please complete all registration fields.", "warning");
                return;
            }

            try {
                const res = await apiFetch('/signup', {
                    method: 'POST',
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        role,
                        department
                    })
                });

                if (res.status === 'success') {
                    showToast(res.message || "Registration successful! Please log in.");
                    signupForm.reset();
                    switchTab('login');
                } else {
                    showToast(res.message || "Registration failed.", "error");
                }
            } catch (err) {
                showToast(err.message || "Signup failed.", "error");
            }
        });
    </script>
</body>
</html>
